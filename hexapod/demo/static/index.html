<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>六足机器人 Stage 2a 演示</title>
  <style>
    :root{color-scheme:dark;--bg:#07111f;--panel:#101e31;--line:#243650;--blue:#42a5ff;--green:#54d39a;--text:#edf6ff;--muted:#9db0c9}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#142c49 0,var(--bg) 45%);color:var(--text);font-family:Inter,"Noto Sans SC",system-ui,sans-serif;min-height:100vh}
    main{max-width:1380px;margin:auto;padding:28px}.header{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:20px}.eyebrow{color:var(--blue);font-size:13px;letter-spacing:.16em;text-transform:uppercase}.header h1{font-size:30px;margin:6px 0}.header p{color:var(--muted);margin:0}.badge{border:1px solid #2f557d;background:#102944;padding:9px 14px;border-radius:999px;color:#b9dcff;white-space:nowrap}
    .grid{display:grid;grid-template-columns:minmax(0,2.1fr) minmax(330px,1fr);gap:20px}.card{background:rgba(16,30,49,.93);border:1px solid var(--line);border-radius:18px;box-shadow:0 22px 70px #0007;overflow:hidden}.viewer{position:relative;aspect-ratio:4/3;background:#02070d}.viewer img{width:100%;height:100%;object-fit:cover;display:block}.overlay{position:absolute;left:16px;top:16px;padding:8px 11px;border-radius:9px;background:#07111fcc;border:1px solid #38506d;font-size:13px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green);margin-right:7px}
    .side{padding:22px}.side h2{font-size:17px;margin:0 0 16px}.pad{display:grid;grid-template-columns:repeat(3,76px);grid-template-rows:repeat(3,62px);justify-content:center;gap:10px;margin:18px 0}.cmd{border:1px solid #355170;background:#172b44;color:var(--text);border-radius:13px;font-size:20px;cursor:pointer;transition:.15s}.cmd:hover{border-color:var(--blue);transform:translateY(-1px)}.cmd.active{background:#17639d;border-color:#65bdff;box-shadow:0 0 24px #258de955}.forward{grid-column:2}.left{grid-column:1;grid-row:2}.stand{grid-column:2;grid-row:2;color:#ffd76a}.right{grid-column:3;grid-row:2}.backward{grid-column:2;grid-row:3}.speed-row{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin-top:24px}input[type=range]{width:100%;accent-color:var(--blue);margin:10px 0 22px}.actions{display:flex;gap:10px}.secondary{flex:1;background:#172b44;color:var(--text);border:1px solid #355170;border-radius:10px;padding:10px;cursor:pointer}
    .metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}.metric{background:#0b1727;border:1px solid #213650;padding:12px;border-radius:12px}.metric label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}.metric strong{font-variant-numeric:tabular-nums;font-size:15px}.wide{grid-column:1/-1}.hint{color:var(--muted);font-size:12px;line-height:1.6;margin-top:18px}.error{color:#ff8e8e;display:none;margin-top:12px}
    @media(max-width:900px){main{padding:14px}.header{align-items:start;flex-direction:column}.grid{grid-template-columns:1fr}.side{padding:18px}}
  </style>
</head>
<body>
<main>
  <div class="header"><div><div class="eyebrow">MuJoCo · Deterministic Actor</div><h1>六足机器人 Stage 2a 成果演示</h1><p>前后左右轴向速度跟踪与静止站立</p></div><div class="badge" id="policy">加载策略…</div></div>
  <div class="grid">
    <section class="card viewer"><img src="/stream" alt="MuJoCo实时仿真"><div class="overlay"><span class="dot"></span><span id="mode">静止</span></div></section>
    <section class="card side">
      <h2>速度指令</h2>
      <div class="pad">
        <button class="cmd forward" data-command="forward" title="W">↑</button>
        <button class="cmd left" data-command="left" title="A">←</button>
        <button class="cmd stand active" data-command="stand" title="空格">■</button>
        <button class="cmd right" data-command="right" title="D">→</button>
        <button class="cmd backward" data-command="backward" title="S">↓</button>
      </div>
      <div class="speed-row"><span>目标速度</span><strong id="speedValue">0.15 m/s</strong></div>
      <input id="speed" type="range" min="0.10" max="0.20" step="0.01" value="0.15">
      <div class="actions"><button class="secondary" id="reset">重置机器人</button></div>
      <div class="metrics">
        <div class="metric"><label>目标 XY</label><strong id="target">0.000, 0.000</strong></div>
        <div class="metric"><label>实际 XY</label><strong id="actual">0.000, 0.000</strong></div>
        <div class="metric"><label>目标速度</label><strong id="targetSpeed">0.000 m/s</strong></div>
        <div class="metric"><label>实际速度</label><strong id="actualSpeed">0.000 m/s</strong></div>
        <div class="metric"><label>足端接地</label><strong id="contacts">0 / 6</strong></div>
        <div class="metric"><label>仿真时间</label><strong id="time">0.00 s</strong></div>
        <div class="metric wide"><label>机身 Roll / Pitch / Yaw</label><strong id="rpy">0.0° / 0.0° / 0.0°</strong></div>
      </div>
      <div class="error" id="error"></div>
      <div class="hint">方向定义：前进 +X、后退 −X、左移 +Y、右移 −Y。也可使用 W/A/S/D，松开按键后自动发送静止指令；空格立即静止。</div>
    </section>
  </div>
</main>
<script>
const labels={stand:'静止',forward:'前进 +X',backward:'后退 −X',left:'左移 +Y',right:'右移 −Y'};
let current='stand'; const speed=document.querySelector('#speed');
const fmt=(v,n=3)=>Number(v).toFixed(n);
async function send(command){
  const res=await fetch('/api/command',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({command,speed:Number(speed.value)})});
  const data=await res.json(); if(!res.ok) throw new Error(data.error||'指令失败'); current=command; select(command); update(data);
}
function select(command){document.querySelectorAll('.cmd').forEach(x=>x.classList.toggle('active',x.dataset.command===command));document.querySelector('#mode').textContent=labels[command];}
function update(s){
  document.querySelector('#policy').textContent=`Stage 2a · 第 ${s.iteration} 轮`;
  document.querySelector('#target').textContent=s.target_velocity_m_s.map(x=>fmt(x)).join(', ');
  document.querySelector('#actual').textContent=s.actual_velocity_m_s.map(x=>fmt(x)).join(', ');
  document.querySelector('#targetSpeed').textContent=`${fmt(s.target_speed_m_s)} m/s`;
  document.querySelector('#actualSpeed').textContent=`${fmt(s.actual_speed_m_s)} m/s`;
  document.querySelector('#contacts').textContent=`${s.feet_in_contact} / 6${s.body_contact?' · 机身触地':''}`;
  document.querySelector('#time').textContent=`${fmt(s.simulation_time_s,2)} s`;
  document.querySelector('#rpy').textContent=s.rpy_deg.map(x=>`${fmt(x,1)}°`).join(' / ');
  const error=document.querySelector('#error'); error.style.display=s.render_error?'block':'none'; error.textContent=s.render_error||'';
}
document.querySelectorAll('.cmd').forEach(b=>b.onclick=()=>send(b.dataset.command).catch(e=>alert(e.message)));
speed.oninput=()=>document.querySelector('#speedValue').textContent=`${Number(speed.value).toFixed(2)} m/s`;
speed.onchange=()=>{if(current!=='stand')send(current).catch(e=>alert(e.message));};
document.querySelector('#reset').onclick=async()=>{await fetch('/api/reset',{method:'POST'});await send('stand');};
const keys={KeyW:'forward',KeyS:'backward',KeyA:'left',KeyD:'right',Space:'stand'};
document.addEventListener('keydown',e=>{if(keys[e.code]&&!e.repeat){e.preventDefault();send(keys[e.code]).catch(()=>{});}});
document.addEventListener('keyup',e=>{if(keys[e.code]&&e.code!=='Space'){e.preventDefault();send('stand').catch(()=>{});}});
setInterval(async()=>{try{const r=await fetch('/api/status');update(await r.json());}catch(e){}},250);
</script>
</body>
</html>
